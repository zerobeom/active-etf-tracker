name: Backfill KoAct holdings (past dates)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일 (YYYY-MM-DD, 예: 2025-02-01)"
        required: true
      end_date:
        description: "종료일 (YYYY-MM-DD, 예: 2026-06-26)"
        required: true
      providers:
        description: "대상 선택 (운용사 단위 또는 ETF 하나만 콕 집어서)"
        required: true
        type: choice
        default: "전체"
        options:
          - 전체
          - samsung (삼성 2종 전체)
          - sol (SOL 2종 전체)
          - time (TIME 2종 전체)
          - tiger (TIGER 1종)
          - us-nasdaq (KoAct 미국나스닥성장기업액티브)
          - kr-valueup (KoAct 코리아밸류업액티브)
          - sol-nexttech (SOL 미국넥스트테크TOP10액티브)
          - sol-megatech (SOL 코리아메가테크액티브)
          - time-nasdaq100 (TIME 미국나스닥100액티브)
          - time-sp500 (TIME 미국S&P500액티브)
          - tiger-koreatech (TIGER 코리아테크액티브)

permissions:
  contents: write

concurrency:
  group: update-holdings
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill holdings
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          RAW="${{ github.event.inputs.providers }}"
          ONLY="${RAW%% *}"   # "sol (SOL 2종 전체)" -> "sol" / "전체" -> "전체" 그대로
          if [ "$ONLY" = "전체" ]; then
            python scripts/fetch_holdings.py "${START//-/}:${END//-/}"
          else
            python scripts/fetch_holdings.py "${START//-/}:${END//-/}" "--only=$ONLY"
          fi

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변동 없음 — 커밋 생략"
          else
            git commit -m "data: backfill ${{ github.event.inputs.start_date }} ~ ${{ github.event.inputs.end_date }}${{ github.event.inputs.providers != '전체' && format(' ({0})', github.event.inputs.providers) || '' }}"
            git push
          fi
